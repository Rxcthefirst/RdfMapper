# ════════════════════════════════════════════════════════════════════════════════
# RDFMap Configuration - Universal Data Mapping Format
# ════════════════════════════════════════════════════════════════════════════════
#
# Supports: CSV, TSV, Excel, JSON, XML, SQL databases, and any RML-compatible source
# Based on RML/YARRRML standards with RDFMap enhancements
#
# ════════════════════════════════════════════════════════════════════════════════

# Namespace prefixes (standard RML/YARRRML)
namespaces:
  xsd: http://www.w3.org/2001/XMLSchema#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  ex: https://example.com/mortgage#
  owl: http://www.w3.org/2002/07/owl#

# Base IRI for generated resources
base_iri: http://example.org/

# Data sources - can be files, databases, APIs
# Format: source_name -> [path/connection_string, iterator (optional)]
sources:
  loans_data:
    - ../data/loans.csv
    - csv  # Format: csv, json, xml, xlsx, etc.

  # Example: JSON with iterator
  # loans_json:
  #   - ../data/loans.json
  #   - json
  #   - $.loans[*]  # JSONPath iterator for nested data

  # Example: XML with XPath
  # loans_xml:
  #   - ../data/loans.xml
  #   - xml
  #   - //loan  # XPath iterator

# Mappings - how to transform each source to RDF
# Each mapping defines:
# 1. Which source(s) to use
# 2. Subject (IRI template + rdf:type)
# 3. Predicates & Objects (properties)
mappings:

  # Mapping for MortgageLoan entities
  MortgageLoan:
    sources: loans_data  # Reference to source above

    # Subject configuration
    subject:
      iri_template: "{base_iri}mortgage_loan/{LoanID}"
      class: ex:MortgageLoan  # Can be list for multiple types

    # Data properties (literals)
    properties:
      LoanID:
        predicate: ex:loanNumber
        datatype: xsd:string
        required: true

      Principal:
        predicate: ex:principalAmount
        datatype: xsd:integer
        transform: to_integer  # RDFMap enhancement: data transformation
        required: true

      InterestRate:
        predicate: ex:interestRate
        datatype: xsd:decimal
        transform: to_decimal
        required: true

      OriginationDate:
        predicate: ex:originationDate
        datatype: xsd:date
        transform: to_date
        required: true

      LoanTerm:
        predicate: ex:loanTerm
        datatype: xsd:integer
        transform: to_integer
        required: true

      Status:
        predicate: ex:loanStatus
        datatype: xsd:string
        required: true

    # Object properties (relationships to other entities)
    relationships:
      hasBorrower:
        predicate: ex:hasBorrower
        object:
          iri_template: "{base_iri}borrower/{BorrowerID}"
          class: ex:Borrower
          properties:
            BorrowerName:
              predicate: ex:borrowerName
              datatype: xsd:string
              required: true

      collateralProperty:
        predicate: ex:collateralProperty
        object:
          iri_template: "{base_iri}property/{PropertyID}"
          class: ex:Property
          properties:
            PropertyAddress:
              predicate: ex:propertyAddress
              datatype: xsd:string
              required: true

# ════════════════════════════════════════════════════════════════════════════════
# RDFMap-Specific Configuration (optional enhancements)
# ════════════════════════════════════════════════════════════════════════════════

# Validation configuration
validation:
  shacl:
    enabled: true
    shapes_file: ../shapes/mortgage_shapes.ttl
    inference: none

# Processing options
options:
  on_error: report  # report, skip, fail
  skip_empty_values: true
  chunk_size: 1000  # For large datasets
  aggregate_duplicates: true
  output_format: ttl  # ttl, nt, xml, jsonld

# Ontology imports for AI-powered mapping generation
imports:
  - ../ontology/mortgage_ontology.ttl

